name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation alone does not need a Windows build.
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      # A prebuilt binary when one is published; otherwise it compiles one.
      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Build the installer
        run: cargo packager --release -p waggle

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: waggle-windows
          path: |
            target/packager/*.exe
            target/release/waggle.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/packager/*.exe
