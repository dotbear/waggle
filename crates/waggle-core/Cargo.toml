[package]
name = "waggle-core"
description = "Portable engine behind Waggle: EVE logs, intel, Directorbot, ESI, mining"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
getrandom = "0.4.3"
httpdate = "1.0.3"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1.1.5"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
file-id = "=0.2.3"
