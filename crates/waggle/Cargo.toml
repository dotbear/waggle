[package]
name = "waggle"
description = "Lightweight EVE Online intel, Directorbot pings, PAP count and mining meter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
directories = "6.0.0"
open = "=5.4.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
# The software renderer: femtovg needs OpenGL 3+, which VMs, remote sessions
# and machines with poor drivers do not have (docs/windows-notes.md).
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
waggle-core = { path = "../waggle-core" }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.8.1"
tray-icon = "=0.26.1"
windows-sys = { version = "=0.61.2", features = ["Win32_System_StationsAndDesktops", "Win32_UI_Shell"] }

[dev-dependencies]
png = "=0.18.1"

[build-dependencies]
slint-build = "=1.18.1"
winresource = "=0.1.34"

# The Windows installer, built by `cargo packager --release -p waggle` on a
# Windows machine (CI does this). Per user, no administrator rights needed.
[package.metadata.packager]
productName = "Waggle"
identifier = "io.github.dotbear.waggle"
description = "Lightweight EVE Online intel, Directorbot pings, PAP count and mining meter"
homepage = "https://github.com/dotbear/waggle"
publisher = "dotbear"
icons = ["../../assets/waggle.ico"]
formats = ["nsis"]
outDir = "../../target/packager"
beforePackagingCommand = "cargo build --release -p waggle"
binaries = [{ path = "waggle", main = true }]
# The GPL is shipped with the program rather than shown as a page to agree
# to: it is not an end-user agreement, and nobody needs to accept it to use
# the software.
resources = [{ src = "../../LICENSE", target = "LICENSE.txt" }]

[package.metadata.packager.nsis]
installMode = "currentUser"
installerIcon = "../../assets/waggle.ico"
sidebarImage = "../../assets/installer-sidebar.bmp"
headerImage = "../../assets/installer-header.bmp"
# Offered as a checkbox when uninstalling, off by default.
appdataPaths = ["$APPDATA/Waggle", "$LOCALAPPDATA/Waggle/data"]
